<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活保護のしらべもの</title>
<style>
:root{
  /* 常に白基調。配信の画面共有と視聴者の画面で見え方を揃えるため、ダークモードには切り替えない */
  --ground:#ffffff; --panel:#fafbfc; --ink:#242c36; --sub:#5f6a77;
  --navy:#2b5d8f; --navy-soft:#eef3f8; --on-navy:#ffffff;
  --ok:#2a7355; --ok-soft:#eaf5ef;
  --line:#e2e7ec; --radius:20px;
}
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); margin:0;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif}
.wrap{max-width:920px; margin:0 auto; padding:28px 16px 44px}

header{margin-bottom:20px}
h1{font-size:clamp(26px,5.6vw,36px); line-height:1.35; margin:0; color:var(--navy)}

/* 検索 */
.search{position:relative; margin-bottom:14px}
.search input{width:100%; font:inherit; font-size:16px; padding:13px 18px 13px 46px;
  border:2px solid var(--line); border-radius:999px; background:var(--panel); color:var(--ink)}
.search input:focus{outline:none; border-color:var(--navy); background:#fff}
.search span{position:absolute; left:17px; top:50%; transform:translateY(-50%); font-size:18px; opacity:.6}

/* 種類タブ */
.tabs{display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px}
.tab{font:inherit; font-size:14.5px; font-weight:700; white-space:nowrap; cursor:pointer;
  border:2px solid var(--line); background:#fff; color:var(--sub); border-radius:999px; padding:7px 18px}
.tab[aria-pressed="true"]{background:var(--navy); border-color:var(--navy); color:var(--on-navy)}
.count{font-size:13px; color:var(--sub); margin:0 0 12px}

/* 格子カード：スマホ2列 → 幅が広いと3列 */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
@media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr); gap:16px} }

a.card{display:flex; flex-direction:column; text-decoration:none; color:inherit; position:relative;
  background:#fff; border:2px solid var(--line); border-radius:var(--radius); padding:16px 14px 14px;
  transition:transform .15s, border-color .15s, box-shadow .15s}
a.card:hover,a.card:focus-visible{border-color:var(--navy); transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(43,93,143,.12); outline:none}
.icon{width:48px; height:48px; border-radius:16px; display:grid; place-items:center; font-size:25px;
  background:var(--navy-soft); margin-bottom:10px}
.card.tool .icon{background:var(--ok-soft)}
.kind{align-self:flex-start; font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--on-navy);
  background:var(--navy); border-radius:999px; padding:1px 10px; margin-bottom:6px}
.card.tool .kind{background:var(--ok)}
.card h3{margin:0 0 4px; font-size:16px; line-height:1.45; color:var(--navy)}
.card p{margin:0; font-size:13px; line-height:1.55; color:var(--sub)}
.new{position:absolute; top:10px; right:10px; font-size:10.5px; font-weight:700; color:#b3261e;
  background:#fdecea; border-radius:999px; padding:0 8px}
.empty{grid-column:1/-1; text-align:center; color:var(--sub); padding:30px 0}

footer{margin-top:30px; padding-top:18px; border-top:1px solid var(--line); text-align:center}
.credit{margin:0; font-size:14px; font-weight:700; color:var(--ink)}
.credit a{color:var(--navy)}
.note{margin:10px 0 0; font-size:11.5px; color:var(--sub)}
</style>
<script>
/* URLの後ろの ?… は付けず、ページの場所だけで数える（同じページが別々に数えられないように） */
window.goatcounter = {path: function () { return location.pathname; }};
</script>
<script data-goatcounter="https://liber-seiho.goatcounter.com/count" async src="https://gc.zgo.at/count.v5.js" crossorigin="anonymous" integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
</head>
<body>
<div class="wrap">

<header>
  <h1 class="mincho">生活保護のしらべもの</h1>
</header>

<div class="search"><span>🔍</span><input id="q" type="search" placeholder="さがす（例：家賃、給料、窓口）" aria-label="さがす"></div>
<div class="tabs" id="tabs">
  <button class="tab" data-kind="all" aria-pressed="true">すべて</button>
  <button class="tab" data-kind="tool" aria-pressed="false">🛠 ツール</button>
  <button class="tab" data-kind="doc" aria-pressed="false">📖 解説</button>
</div>
<p class="count" id="count"></p>
<div class="grid" id="grid"></div>

<footer>
  <p class="credit">作成：<a href="https://www.youtube.com/channel/UCHLF5SOHCHcA-tiVJWGGshA" target="_blank" rel="noopener">リベル_Liber</a>（YouTubeチャンネル）</p>
  <p class="note">個人が作ったページで、行政の公式ページではありません。最終確認はお住まいの地域の窓口で。</p>
</footer>
</div>

<!-- カードの一覧は hub-items.js にある。足すときはそちらに1行足す -->
<script src="hub-items.js"></script>
<script>
const KIND = {tool:"ツール", doc:"解説"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grid = document.getElementById("grid"), q = document.getElementById("q"), count = document.getElementById("count");
let kind = "all";

function render(){
  const w = q.value.trim().toLowerCase();
  const list = ITEMS.filter(i => (kind === "all" || i.kind === kind) &&
    (!w || (i.title + i.desc + (i.kw || "")).toLowerCase().includes(w)));
  grid.innerHTML = list.map(i => `
    <a class="card ${esc(i.kind)}" href="${esc(i.href)}">
      ${i.isNew ? '<span class="new">NEW</span>' : ''}
      <div class="icon">${i.icon}</div>
      <span class="kind">${KIND[i.kind] || ""}</span>
      <h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p>
    </a>`).join("") || '<div class="empty">見つかりませんでした。別のことばで試してください。</div>';
  count.textContent = list.length + " 件";
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  kind = b.dataset.kind;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", t === b));
  render();
});
q.addEventListener("input", render);
render();
</script>
</body>
</html>
