<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窓口では教えてくれない？生活保護で知っておくと役立つ法律5つ</title>
<meta name="description" content="申請の窓口で止められない、結果は書面で理由つき、保護は正当な理由なく減らされない、差押え・課税の禁止、指導は強制できない。生活保護で知っておくと役立つ法律5つを、原文つきで生活保護3年目が説明します">
<style>
:root{
  /* 常に白基調。ダークモードには切り替えない */
  --ground:#ffffff; --panel:#fafbfc; --ink:#242c36; --sub:#5f6a77;
  --navy:#2b5d8f; --navy-soft:#eef3f8; --on-navy:#ffffff;
  --ok:#2a7355; --ok-bg:#f1f7f4; --ng:#a4483c; --ng-bg:#fdf3f1;
  --warn:#8a6420; --warn-bg:#fdf7ea; --line:#e2e7ec; --line-soft:#f0f3f6;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{background:var(--ground); color:var(--ink); margin:0;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
  font-size:17px; line-height:1.8; -webkit-text-size-adjust:100%}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif}
.num{font-variant-numeric:tabular-nums}
/* 言葉の途中で改行しない。対応ブラウザは文節で折り返す */
.nb{display:inline-block}
h1,.conclusion p,.ch h2,.for-who li,.cta,.card b,.why .nm,.steps b{word-break:auto-phrase}
.wrap{max-width:720px; margin:0 auto; padding:26px 16px 44px}
h1{font-size:clamp(26px,6vw,36px); line-height:1.4; margin:0 0 12px; color:var(--navy); text-wrap:balance}
h1 small{display:block; font-size:.55em; color:var(--sub); font-weight:600; margin-top:4px}
.for-who{background:var(--navy-soft); border-left:5px solid var(--navy); border-radius:0 11px 11px 0; padding:12px 16px; margin-bottom:16px; font-size:16.5px}
.for-who b{color:var(--navy)} .for-who ul{margin:4px 0 0; padding-left:1.2em}
.conclusion{border:2px solid var(--navy); border-radius:14px; padding:16px; margin-bottom:10px; background:#fff}
.conclusion .k{font-size:14.5px; font-weight:700; color:var(--sub)}
.conclusion p{margin:4px 0 0; font-size:18px; font-weight:700; line-height:1.6}
.conclusion b{color:var(--navy)}
.conclusion .big{font-size:1.5em}
.cta{display:flex; align-items:center; justify-content:space-between; gap:10px; text-decoration:none; color:var(--navy); background:var(--navy-soft); border-left:5px solid var(--navy); border-radius:0 11px 11px 0; padding:11px 14px; margin:12px 0 22px; font-weight:700; font-size:16.5px; min-height:48px}
.cta span:last-child{flex:none}
section.ch{margin:30px 0 8px}
.ch h2{display:flex; align-items:center; gap:10px; font-size:clamp(19px,4.6vw,23px); line-height:1.45; margin:0 0 12px; color:var(--navy)}
.ch h2 .b{flex:none; width:34px; height:34px; border-radius:50%; border:2px solid var(--navy); display:grid; place-items:center; font-size:16.5px; font-family:system-ui,sans-serif}
.ch p{margin:0 0 12px}
.ch a{color:var(--navy); font-weight:700}
blockquote{margin:10px 0 4px; padding:10px 14px; background:var(--panel); border-left:4px solid var(--line); font-size:16px; border-radius:0 10px 10px 0}
.src{font-size:14.5px; color:var(--sub); margin:0 0 8px} .src a{color:var(--navy); font-weight:400}
.easy{background:var(--ok-bg); border-left:4px solid var(--ok); border-radius:0 10px 10px 0; padding:9px 14px; font-size:16.5px; margin:6px 0 12px}
.easy b{color:var(--ok)}
.note{font-size:14.5px; color:var(--sub); margin:4px 0 12px}

/* 1章: 3ステップ */
.steps{list-style:none; margin:6px 0 12px; padding:0; counter-reset:s}
.steps li{position:relative; border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:10px 12px 10px 48px; margin-bottom:8px}
.steps li::before{counter-increment:s; content:counter(s); position:absolute; left:12px; top:11px; width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:14px; font-weight:700}
.steps b{display:block}
.steps small{display:block; color:var(--sub); font-size:15px; line-height:1.6}
.one{border-left:5px solid var(--navy); background:var(--navy-soft); border-radius:0 11px 11px 0; padding:10px 14px; font-weight:700; margin:8px 0 12px}
.one small{display:block; font-weight:600; color:var(--sub); font-size:14.5px}
details.word{margin:6px 0 12px; border:1px solid var(--line); border-radius:11px; padding:0 12px; background:#fff}
details.word summary{cursor:pointer; font-weight:700; color:var(--navy); min-height:46px; display:flex; align-items:center; font-size:16px}
details.word p{font-size:16px; margin:0 0 10px}

/* 2章: 100世帯の点の図 */
.fig{border:1.5px solid var(--navy); border-radius:14px; padding:14px 16px; background:#fff; margin:8px 0 12px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px}
.seg button{font:inherit; font-size:15.5px; font-weight:700; min-height:48px; border:2px solid var(--line); border-radius:11px; background:#fff; color:var(--sub); cursor:pointer; padding:6px 8px; line-height:1.4}
.seg button[aria-pressed=true]{border-color:var(--navy); background:var(--navy-soft); color:var(--navy)}
.fig .cap{font-size:15px; font-weight:700; color:var(--sub); margin:0 0 2px}
.fig .val{font-size:clamp(34px,9vw,46px); font-weight:800; color:var(--navy); line-height:1.25}
.fig .val small{font-size:.42em; color:var(--ink); font-weight:700}
.dots{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; max-width:330px; margin:10px 0 8px}
.dots i{display:block; aspect-ratio:1; border-radius:50%; background:var(--line-soft); border:1.5px solid var(--line); transition:background .35s, border-color .35s, transform .35s}
.dots i.on{background:var(--navy); border-color:var(--navy); transform:scale(1.06)}
.lg{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:14.5px; color:var(--sub)}
.lg span::before{content:""; display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; background:var(--c); border:1.5px solid var(--b)}

/* 3章: 年表 */
.tl{list-style:none; margin:4px 0 12px; padding:0 0 0 22px; position:relative}
.tl::before{content:""; position:absolute; left:7px; top:6px; bottom:6px; width:3px; background:var(--line); border-radius:2px}
.tl .line{position:absolute; left:7px; top:6px; width:3px; height:0; background:var(--navy); border-radius:2px; transition:height 1.6s ease}
.tl li{position:relative; margin:0 0 14px; opacity:0; transform:translateX(8px); transition:opacity .5s ease, transform .5s ease}
.tl.in li{opacity:1; transform:none}
.tl li::before{content:""; position:absolute; left:-21px; top:8px; width:13px; height:13px; border-radius:50%; background:#fff; border:3px solid var(--navy)}
.tl li.key::before{background:var(--navy)}
.tl .d{display:block; font-size:14.5px; font-weight:700; color:var(--sub)}
.tl .m{display:inline-block; font-weight:800; color:var(--navy); font-size:1.12em}
.tl q{display:block; font-size:15px; color:var(--sub); border-left:3px solid var(--line); padding-left:8px; margin-top:4px; quotes:"「" "」"}
.caution{background:var(--warn-bg); border-left:5px solid var(--warn); border-radius:0 11px 11px 0; padding:10px 14px; margin:8px 0 12px}
.caution b{color:var(--warn)}

/* 4章: 申請と開始の棒 */
.bars{border:1px solid var(--line); border-radius:13px; background:var(--panel); padding:12px 14px; margin:8px 0 12px}
.bar-row{margin-bottom:10px} .bar-row:last-child{margin-bottom:0}
.bar-row .t{display:flex; justify-content:space-between; gap:8px; font-size:15.5px; font-weight:700}
.bar-row .t span:last-child{color:var(--navy)}
.bar-row .tr{height:20px; border-radius:10px; background:var(--line-soft); overflow:hidden; margin-top:3px}
.bar-row .tr i{display:block; height:100%; width:0; border-radius:10px; background:var(--navy); transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.bar-row .tr i.g{background:var(--ok)}

/* 5章: 使わない理由のカード */
.whys{display:grid; gap:8px; margin:8px 0 12px}
.why{font:inherit; text-align:left; border:1.5px solid var(--line); border-radius:12px; background:#fff; padding:11px 13px; cursor:pointer; min-height:56px; color:var(--ink); width:100%}
.why .nm{display:block; font-weight:800; font-size:17px}
.why .hid{display:block; font-size:14.5px; color:var(--sub)}
.why .ans{display:none; font-size:16px; margin-top:6px}
.why .ans .tag{display:inline-block; font-weight:800; color:var(--ok)}
.why .ans q{display:block; font-size:15px; color:var(--sub); border-left:3px solid var(--line); padding-left:8px; margin:6px 0 2px; quotes:"「" "」"}
.why .ans cite{display:block; font-style:normal; font-size:14px; color:var(--sub)}
.why .ans .me{display:block; margin-top:6px; background:var(--navy-soft); border-radius:9px; padding:7px 10px; font-size:15.5px}
.why .ans .go{display:block; margin-top:6px; font-weight:700; color:var(--navy)}
.why.open{border-color:var(--ok); border-left-width:5px; background:var(--panel)}
.why.open .hid{display:none} .why.open .ans{display:block; animation:up .35s ease}
@keyframes up{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.links{font-size:15.5px; margin:0 0 12px; padding-left:1.2em}
.links li{margin-bottom:3px}

.sum h3{font-size:16px; margin:14px 0 6px; color:var(--navy)}
.card{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:#fff}
.card .mk{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px}
.card .mk.y{background:var(--ok-bg); color:var(--ok)} .card .mk.q{background:var(--warn-bg); color:var(--warn)}
.card b{display:block; font-size:16.5px} .card small{color:var(--sub); font-size:14.5px; line-height:1.55; display:block}
.fade{opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease}
.fade.in{opacity:1; transform:none}
.foot{margin-top:28px; font-size:14.5px; color:var(--sub); border-top:1px solid var(--line); padding-top:14px}
.foot h3{font-size:15px; color:var(--ink); margin:12px 0 4px}
.foot ul{margin:0; padding-left:1.2em} .foot a{color:var(--navy); word-break:break-all}
.foot .credit{margin-top:14px; padding-top:12px; border-top:1px solid var(--line); text-align:center; font-size:14px; font-weight:700; color:var(--ink)}
@media (prefers-reduced-motion:reduce){ .fade,.tl li{opacity:1; transform:none; transition:none} .tl .line,.dots i,.bar-row .tr i{transition:none} .why .ans{animation:none} }
</style>
<script>
/* URLの後ろの ?… は付けず、ページの場所だけで数える（同じページが別々に数えられないように） */
window.goatcounter = {path: function () { return location.pathname; }};
</script>
<script data-goatcounter="https://liber-seiho.goatcounter.com/count" async src="https://gc.zgo.at/count.v5.js" crossorigin="anonymous" integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
<script>
/* ツールで結果が出たときに1回だけ「利用/ツール名」を数える。入力した内容は送らない */
window.gcUse = function (name) {
  window.gcUse.done = window.gcUse.done || {};
  if (window.gcUse.done[name]) return;
  window.gcUse.done[name] = true;
  var tries = 0;
  (function send() {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({path: '利用/' + name, title: name, event: true});
    } else if (tries++ < 20) {
      setTimeout(send, 500);
    }
  })();
};
</script>
